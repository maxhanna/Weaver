# Runs the full test suite on push/PR — the audit's §4.2 gap (no CI, so the JS
# suites only ran when someone remembered the manual loop). The JS aggregator
# (tests/js/run-all.js) exits non-zero on any failing file, and dotnet test fails
# on any failing xUnit test, so a red commit fails the job.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: C# suite
        # Tests live in tests/Weaver.Tests.csproj, which references Weaver.csproj.
        # The app project pins RuntimeIdentifier=win-x64 + SelfContained=true (the
        # shipped desktop artifact); the overrides below are passed as global
        # properties so the TEST build is framework-dependent linux-x64 and the
        # Linux testhost can launch it (a self-contained win-x64 runtimeconfig has
        # no framework entry — "libhostpolicy.so not found").
        run: dotnet test tests/Weaver.Tests.csproj --nologo -p:RuntimeIdentifier=linux-x64 -p:SelfContained=false

      - name: JS client-logic suite
        run: node tests/js/run-all.js
